<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agente de respuesta ciudadana · Alcaldía de Marinilla</title>
<style>
  :root {
    --govco-blue: #004884;
    --agent-blue: #30a2ff;
    --bar-gray: #52606d;
    --bar-gray-hover: #46525c;
    --text-dark: #1c2530;
    --text-muted: #5b6673;
    --border-color: #e2e5e9;
    --radius-pill: 999px;
    --focus-ring: 0 0 0 3px rgba(46, 156, 224, 0.45);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-dark);
    background: #ffffff;
  }

  a { text-decoration: none; }

  /* Barra superior gov.co */
  .topbar {
    background: var(--govco-blue);
    padding: 18px 24px;
    display: flex;
    align-items: center;
  }

  .govco-link {
    display: inline-flex;
    border-radius: 4px;
  }

  .govco-link:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
  }

  .govco-logo {
    height: 28px;
    display: block;
  }

  /* Contenido principal */
  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 24px 40px;
  }

  .entity {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }

  .entity-logo {
    width: 64px;
    height: 64px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .entity-name {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    color: var(--text-dark);
  }

  .agent-title {
    font-size: 26px;
    font-weight: 600;
    color: var(--agent-blue);
    margin: 0 0 40px;
  }

  .empty-state {
    text-align: center;
    padding: 24px 12px 44px;
  }

  .empty-state svg {
    color: var(--text-dark);
  }

  .empty-state p {
    font-size: 15px;
    color: var(--text-dark);
    margin: 14px 0 0;
  }

  /* Barra de pregunta (texto + micrófono) */
  .query-bar {
    position: relative;
    display: flex;
    align-items: center;
  }

  .query-input {
    width: 100%;
    height: 56px;
    border: none;
    border-radius: var(--radius-pill);
    background: var(--bar-gray);
    color: #ffffff;
    padding: 0 66px 0 22px;
    font-size: 15px;
  }

  .query-input::placeholder {
    color: rgba(255, 255, 255, 0.85);
  }

  .query-input:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
  }

  .mic-button {
    position: absolute;
    right: 6px;
    top: 6px;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: var(--agent-blue);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .mic-button:hover {
    filter: brightness(0.95);
  }

  .mic-button:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
  }

  .mic-button svg {
    color: #ffffff;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Respeta preferencia de movimiento reducido para futuras animaciones */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  @media (max-width: 480px) {
    .entity-logo { width: 52px; height: 52px; }
    .entity-name { font-size: 17px; }
    .agent-title { font-size: 22px; }
  }

  /* Estilos para el componente de caracterización US-02 */
  .char-box {
    text-align: center;
    margin-bottom: 32px;
    background: #f8fafc;
    padding: 24px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
  }
  .char-question {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 18px 0;
    color: var(--text-dark);
  }
  .char-options {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .char-btn {
    padding: 10px 20px;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-pill);
    cursor: pointer;
    font-size: 14px;
    color: var(--text-dark);
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .char-btn:hover {
    background: var(--govco-blue);
    color: #ffffff;
    border-color: var(--govco-blue);
  }
  .char-skip-lnk {
    background: none;
    border: none;
    color: var(--text-muted);
    text-decoration: underline;
    font-size: 13px;
    cursor: pointer;
    padding: 4px;
  }
  .char-skip-lnk:hover {
    color: var(--text-dark);
  }
  
</style>
</head>
<body>

  <header class="topbar">
    <a
      class="govco-link"
      href="https://www.gov.co"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Ir al portal del Estado colombiano gov.co"
    >
      <!-- TODO: reemplazar por el logo oficial blanco de gov.co -->
      <img class="govco-logo" src="assets/govco-logo-blanco.svg" alt="gov.co">
    </a>
  </header>

  <main class="app">
    <div class="entity">
      <img class="entity-logo" src="assets/logo-alcaldia-marinilla.png" alt="Escudo de la Alcaldía de Marinilla">
      <h1 class="entity-name">Alcaldía de Marinilla - Antioquia</h1>
    </div>

    <h2 class="agent-title">Agente de respuesta ciudadana</h2>

    <div class="empty-state">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
      <p>Pregunta sobre trámites, formatos o normatividad</p>
    </div>

    <!-- US-02: Contenedor de Caracterización (Flujo de Preguntas) -->
    <div id="characterization-container" class="char-box">
      
      <!-- Pantalla 1: Formato de información -->
      <div id="char-step-1" class="char-step">
        <p class="char-question">¿Cómo prefieres recibir la información?</p>
        <div class="char-options">
          <button type="button" class="char-btn" onclick="nextStep(1, 'audio')">🔊 Audio</button>
          <button type="button" class="char-btn" onclick="nextStep(1, 'texto')">📝 Texto</button>
          <button type="button" class="char-btn" onclick="nextStep(1, 'ambos')">🔄 Ambos</button>
        </div>
        <button type="button" class="char-skip-lnk" onclick="abortCharacterization()">Prefiero no responder</button>
      </div>

      <!-- Pantalla 2: Familiaridad legal -->
      <div id="char-step-2" class="char-step" style="display: none;">
        <p class="char-question">¿Qué tan familiarizado(a) estás con trámites y documentos legales?</p>
        <div class="char-options">
          <button type="button" class="char-btn" onclick="nextStep(2, 'poco')">Poco</button>
          <button type="button" class="char-btn" onclick="nextStep(2, 'algo')">Algo</button>
          <button type="button" class="char-btn" onclick="nextStep(2, 'mucho')">Mucho</button>
        </div>
        <button type="button" class="char-skip-lnk" onclick="abortCharacterization()">Prefiero no responder</button>
      </div>

      <!-- Pantalla 3: Nivel de lenguaje -->
      <div id="char-step-3" class="char-step" style="display: none;">
        <p class="char-question">¿Prefieres explicaciones sencillas o más técnicas?</p>
        <div class="char-options">
          <button type="button" class="char-btn" onclick="nextStep(3, 'sencillo')">Sencillo</button>
          <button type="button" class="char-btn" onclick="nextStep(3, 'tecnico')">Técnico</button>
        </div>
        <button type="button" class="char-skip-lnk" onclick="abortCharacterization()">Prefiero no responder</button>
      </div>

    </div>

    <div id="active-profile-badge" style="display: none; text-align: center; margin-bottom: 24px;">
      <span style="background: var(--border-color); padding: 4px 12px; border-radius: var(--radius-pill); font-size: 13px; color: var(--text-muted);">
        Perfil activo: <strong id="profile-name" style="color: var(--govco-blue);">Neutro</strong>
      </span>
    </div>

    <form class="query-bar" id="query-form" style="display: none;">
      <label for="query-input" class="sr-only">Escribe tu pregunta</label>
      <input
        type="text"
        id="query-input"
        name="query"
        class="query-input"
        placeholder="Haz tu pregunta o usa el micrófono"
        autocomplete="off"
      >
      <button type="button" class="mic-button" id="mic-button" aria-label="Preguntar por voz">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
    </form>

 <script>
    // --- Lógica Integrada US-22 (Caracterización) & US-23 (Almacenamiento) ---

    // Objeto temporal para guardar las respuestas del cuestionario activo
    var userAnswers = {
      format: null,
      legalFamiliarity: null,
      complexity: null
    };

    // 1. Función núcleo para guardar el perfil y actualizar la interfaz
    function setProfile(profileCode, profileName) {
      localStorage.setItem('agente_perfil_codigo', profileCode);
      localStorage.setItem('agente_perfil_nombre', profileName);
      applyProfileUI(profileName);
    }

    // 2. Función que oculta el bloque de preguntas y muestra la barra
    function applyProfileUI(profileName) {
      document.getElementById('characterization-container').style.display = 'none';
      document.getElementById('profile-name').innerText = profileName;
      document.getElementById('active-profile-badge').style.display = 'block';
      document.getElementById('query-form').style.display = 'flex';
    }

    // 3. Validación al cargar la página (Memoria del usuario)
   // 3. Validación al cargar la página (¡DESACTIVADA TEMPORALMENTE PARA PRUEBAS!)
    window.addEventListener('DOMContentLoaded', function() {
      // Borramos lo que haya quedado viejo de una vez al recargar
      localStorage.clear(); 
      
      // Comentamos esto para que NUNCA salte el cuestionario solo:
      /*
      var savedProfileName = localStorage.getItem('agente_perfil_nombre');
      if (savedProfileName) {
        applyProfileUI(savedProfileName);
      }
      */
    });

    // 4. Regla de omisión: Salida de emergencia
    function abortCharacterization() {
      setProfile('P0', 'Perfil 0 (Neutro)');
    }

    // 5. Control de flujo paso a paso y cálculo del árbol de decisión
    function nextStep(currentStep, answer) {
      if (currentStep === 1) {
        userAnswers.format = answer;
        
        // Ocultamos pantalla 1 y mostramos pantalla 2
        document.getElementById('char-step-1').style.display = 'none';
        document.getElementById('char-step-2').style.display = 'flex';
        document.getElementById('char-step-2').style.flexDirection = 'column'; 
        document.getElementById('char-step-2').style.alignItems = 'center';
      } 
      else if (currentStep === 2) {
        userAnswers.legalFamiliarity = answer;
        
        if (userAnswers.format === 'audio' && userAnswers.legalFamiliarity === 'poco') {
          setProfile('P1', 'Perfil 1 (Asistencia por voz)');
        } 
        else if (userAnswers.format === 'texto' && (userAnswers.legalFamiliarity === 'poco' || userAnswers.legalFamiliarity === 'algo')) {
          setProfile('P2', 'Perfil 2 (Ciudadano general)');
        } 
        else if (userAnswers.format === 'texto' && userAnswers.legalFamiliarity === 'mucho') {
          // Pasamos a la pantalla 3 opcional
          document.getElementById('char-step-2').style.display = 'none';
          document.getElementById('char-step-3').style.display = 'flex';
          document.getElementById('char-step-3').style.flexDirection = 'column';
          document.getElementById('char-step-3').style.alignItems = 'center';
        } 
        else {
          setProfile('P2', 'Perfil 2 (Ciudadano general)');
        }
      } 
      else if (currentStep === 3) {
        userAnswers.complexity = answer;
        if (userAnswers.complexity === 'tecnico') {
          setProfile('P3', 'Perfil 3 (Usuario técnico)');
        } else {
          setProfile('P2', 'Perfil 2 (Ciudadano general)');
        }
      }
    }

    // --- Funciones previas del formulario ---
    
    // TODO (US-04): conectar el envío de la pregunta con el backend del agente RAG
    function handleQuerySubmit(question) {
      console.log('Pregunta enviada (pendiente de enrutar):', question);
    }

    // TODO (US-05): implementar captura de audio
    function handleMicClick() {
      console.log('Micrófono presionado (pendiente de implementar)');
    }

    // Eventos de la barra de búsqueda
    var queryForm = document.getElementById('query-form');
    if(queryForm) {
      queryForm.addEventListener('submit', function (event) {
        event.preventDefault();
        var input = document.getElementById('query-input');
        handleQuerySubmit(input.value);
      });
    }

    var micButton = document.getElementById('mic-button');
    if(micButton) {
      micButton.addEventListener('click', function () {
        handleMicClick();
      });
    }
  </script>

</body>
</html>
