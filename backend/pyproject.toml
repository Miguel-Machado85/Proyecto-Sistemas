[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "google-genai>=2.21.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.4.8",
    "langchain-google-genai>=4.3.7",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.2.8",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pymupdf>=1.26.0",
    "pillow>=11.0.0",
    "pytesseract>=0.3.13",
    "typing-extensions>=4.15.0",
    "uvicorn[standard]>=0.50.2",
    "boto3>=1.35.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.2",
    "langfuse>=3.0.0",
    "langchain>=1.0.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.4.0",
    "rapidfuzz>=3.9.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg-pool>=3.3.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
