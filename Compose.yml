services:
  backend:
    build:
      context: ./backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      # Postgres sí vive en este compose, se resuelve por nombre de servicio.
      DATABASE_URL: postgresql://sigem:sigem@db:5432/sigem
      # Memoria conversacional persistente: sobrevive a reinicios del contenedor.
      CHECKPOINTER: postgres
      # Caché de Hugging Face del reranker (montada como volumen hf-cache).
      HF_HOME: /app/.cache/huggingface
      # Carga el reranker al arrancar para que la primera consulta no tarde ~30 s.
      RERANKER_PRECARGAR: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - hf-cache:/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 5
      # La API espera a Postgres, crea el checkpointer y precarga el reranker antes de responder.
      start_period: 120s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: sigem
      POSTGRES_PASSWORD: sigem
      POSTGRES_DB: sigem
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigem -d sigem"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  hf-cache:
